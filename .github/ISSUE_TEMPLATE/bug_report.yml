name: Bug report
description: Something renders wrong, crashes or does not work
labels: [bug]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Web (HTML file or GitHub Pages)
        - Desktop (Python script)
        - Windows EXE
        - Command line
    validations:
      required: true
  - type: dropdown
    id: workspace
    attributes:
      label: Workspace
      options:
        - Text Art
        - Unicode Styles / Encoders / Boxes
        - Image Studio
        - Animation Studio
        - Export
        - Other
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the text, font, mode and settings you used. A saved project file (.json) helps a lot.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "e.g. Windows 11, Python 3.13, Chrome 142"
